name: Discord Erinnerungen

# Gestartet wird der Roboter pünktlich von cron-job.org
# (oder von dir zum Testen über "Run workflow").
on:
  workflow_dispatch:
    inputs:
      nummer:
        description: 'Test: Welche Nachricht sofort senden? (Nummer)'
        default: '1'
      start:
        description: 'Nur für cron-job.org – zum Testen leer lassen'
        default: ''

permissions:
  contents: read

jobs:
  erinnerungen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Nachrichten senden
        run: python3 senden.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_NR: ${{ inputs.nummer }}
          START: ${{ inputs.start }}
